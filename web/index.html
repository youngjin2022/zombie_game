<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="좀비 생존 텍스트 어드벤처. 선택 하나가 다음 날을 바꾼다.">
<meta name="theme-color" content="#0d0f10">
<title>좀비 생존 — 아파트 7층</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧟</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body class="fs-m">

<!-- ======================= 불러오는 중 ======================= -->
<div id="boot" class="screen boot">
  <div class="boot-inner">
    <h1 class="boot-title">좀비 생존</h1>
    <p class="boot-sub">아파트 7층</p>
    <p id="boot-msg" class="boot-msg">시나리오를 불러온다…</p>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <p id="boot-error" class="boot-error" hidden></p>
  </div>
</div>

<!-- ======================= 시작 화면 ======================= -->
<div id="title" class="screen" hidden>
  <div class="title-inner">
    <h1 class="title-h1">좀비 생존</h1>
    <p class="title-sub">아파트 7층 · 11월 28일 오후 3시 30분</p>
    <p id="title-codex" class="title-codex"></p>

    <button id="btn-continue" class="btn big" hidden></button>

    <!-- 모드 고르기 -->
    <section class="setup" aria-labelledby="setup-mode-h">
      <p id="setup-notice" class="warn" hidden></p>
      <h2 id="setup-mode-h" class="setup-h">어떻게 할까</h2>
      <div id="mode-list" class="mode-list" role="radiogroup" aria-labelledby="setup-mode-h"></div>

      <!-- 이름 두 칸 -->
      <div class="name-fields">
        <div class="name-field">
          <label id="lb-me" for="in-me">내 이름</label>
          <input id="in-me" type="text" maxlength="10" autocomplete="off"
                 spellcheck="false" enterkeyhint="next" placeholder="한글·영문·숫자 1~10자">
          <p id="err-me" class="field-err" role="status"></p>
        </div>
        <div class="name-field">
          <label id="lb-friend" for="in-friend">함께 생존할 사람의 이름</label>
          <input id="in-friend" type="text" maxlength="10" autocomplete="off"
                 spellcheck="false" enterkeyhint="go" placeholder="한글·영문·숫자 1~10자">
          <p id="err-friend" class="field-err" role="status"></p>
        </div>
      </div>

      <!-- 온라인으로 둘이: 이름은 각자 자기 기기에서 넣고, 방 코드로 만난다 -->
      <div id="online-box" class="online-box" hidden>
        <p class="hint">이름은 각자 자기 기기에서 넣는다. 방장이 방을 만들고 코드를 알려 준다.</p>
        <div class="row">
          <button id="btn-room-create" class="btn primary">방 만들기</button>
        </div>
        <div class="join-row">
          <label for="in-room">방 코드</label>
          <input id="in-room" type="text" maxlength="6" autocomplete="off"
                 spellcheck="false" inputmode="latin" enterkeyhint="go"
                 placeholder="영문·숫자 6자">
          <button id="btn-room-join" class="btn">참가</button>
        </div>
        <p id="room-err" class="field-err" role="status"></p>
        <button id="btn-room-reopen" class="btn" hidden></button>
      </div>

      <button id="btn-start" class="btn big primary" disabled>시작</button>
    </section>

    <div id="prologue" class="prologue"></div>

    <div class="title-buttons">
      <button id="btn-title-codex" class="btn">엔딩 도감</button>
      <button id="btn-title-load" class="btn">불러오기</button>
      <button id="btn-title-settings" class="btn">설정</button>
    </div>
    <p id="storage-warn" class="warn" hidden></p>
  </div>
</div>

<!-- ======================= 방 화면 (온라인) ======================= -->
<div id="room" class="screen room" hidden>
  <div class="room-inner">
    <h1 class="room-h1">온라인으로 둘이</h1>

    <section class="room-code-box">
      <p class="room-code-label">방 코드</p>
      <p id="room-code" class="room-code"></p>
      <div class="row">
        <button id="btn-room-copy" class="btn">링크 복사</button>
        <button id="btn-room-reissue" class="btn" hidden>코드 새로 발급</button>
      </div>
      <p id="room-copy-msg" class="hint"></p>
    </section>

    <section class="room-people">
      <h2 class="setup-h">사람</h2>
      <ul id="room-players" class="room-players"></ul>
      <div id="room-requests" class="room-requests"></div>
      <p id="room-note" class="hint"></p>
    </section>

    <div class="title-buttons">
      <button id="btn-room-start" class="btn big primary" disabled>시작</button>
      <button id="btn-room-leave" class="btn danger">방 나가기</button>
    </div>
  </div>
</div>

<!-- ======================= 게임 화면 ======================= -->
<div id="play" class="screen play" hidden>

  <header id="status" class="status">
    <div class="status-top">
      <span id="st-when" class="st-when"></span>
      <span id="st-where" class="st-where"></span>
      <button id="btn-menu" class="btn menu-btn" aria-label="메뉴" aria-haspopup="dialog">메뉴</button>
    </div>
    <div id="st-chips" class="chips"></div>
    <div id="st-extra" class="status-extra" hidden></div>
  </header>

  <main id="body" class="body" tabindex="-1">
    <div id="blocks" class="blocks"></div>
    <button id="skip" class="skip" hidden>눌러서 전부 보기</button>
  </main>

  <div id="net" class="net" hidden></div>
  <footer id="choices" class="choices"></footer>
</div>

<!-- ======================= 엔딩 화면 ======================= -->
<div id="ending" class="screen ending" hidden>
  <div class="ending-inner">
    <p id="end-type" class="end-type"></p>
    <h1 id="end-title" class="end-title"></h1>
    <div id="end-text" class="end-text"></div>
    <p id="end-stats" class="end-stats"></p>
    <div id="end-duo" class="end-duo" hidden></div>
    <p id="end-new" class="end-new" hidden></p>
    <p id="end-codex" class="end-codex"></p>
    <div class="title-buttons">
      <button id="btn-end-restart" class="btn big primary">처음부터</button>
      <button id="btn-end-codex" class="btn">엔딩 도감</button>
    </div>
  </div>
</div>

<!-- ======================= 겹쳐 띄우는 창 ======================= -->
<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="btn icon" aria-label="닫기">✕</button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="ui.js"></script>
<noscript>
  <p style="padding:2rem;color:#e8e3da">이 게임은 자바스크립트로 돌아간다. 브라우저에서 자바스크립트를 켜라.</p>
</noscript>
</body>
</html>
